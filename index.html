<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SmartRoute - מסלול חכם</title>
    <meta name="description" content="תכנון המסלול הקצר ביותר בין כמה עצירות - למשלוחים, הפצה וטיולים. בונה את הסדר האופטימלי עם ניווט ישיר בוויז.">
    <meta name="keywords" content="תכנון מסלול, מסלול אופטימלי, משלוחים, הפצה, טיולים, עצירות, ניווט, וויז, נסיעות">
    <meta property="og:title" content="SmartRoute - מסלול חכם">
    <meta property="og:description" content="תכנון המסלול הקצר ביותר בין כמה עצירות - למשלוחים, הפצה וטיולים.">
    <meta property="og:type" content="website">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json"/>
    <meta name="theme-color" content="#7b68ee"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="SmartRoute"/>
    <link rel="apple-touch-icon" href="icons/icon-192.png"/>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

    <h1>SmartRoute</h1>
    <h3>תכנון המסלול הקצר ביותר בין כל העצירות שלך</h3>

    <div class="input-wrapper">
        <label>כתובת יציאה</label>
        <input id="startAddress" type="text" placeholder="מאיפה יוצאים">
    </div>

    <div class="input-wrapper">
        <label>כתובת חזרה</label>
        <input id="endAddress" type="text" placeholder="לאן חוזרים">
    </div>

    <h2>עצירות ביניים</h2>
    <div id="addresses-container"></div>

    <button id="addAddressBtn">➕ הוסף כתובת חדשה</button>
    <button id="drawRouteBtn">חשב מסלול</button>

    <ol id="routeList"></ol>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDK6yM28KqdSZUAvonDD7tq-hrILHvlfkA&libraries=places&language=he"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat&family=David+Libre:wght@700&display=swap" rel="stylesheet">

    <script src="app.js" type="module"></script>

    <!-- רישום ה-service worker + רענון אוטומטי כשיש גרסה חדשה -->
    <script>
        if ("serviceWorker" in navigator) {
            let refreshing = false;

            // כשה-service worker החדש משתלט - מרעננים פעם אחת אוטומטית
            navigator.serviceWorker.addEventListener("controllerchange", () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });

            window.addEventListener("load", () => {
                navigator.serviceWorker.register("service-worker.js")
                    .then(reg => {
                        // בודקים אם יש עדכון ממתין
                        reg.addEventListener("updatefound", () => {
                            const newWorker = reg.installing;
                            if (!newWorker) return;
                            newWorker.addEventListener("statechange", () => {
                                // גרסה חדשה הותקנה ויש כבר SW פעיל => לבקש ממנו להשתלט מיד
                                if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: "SKIP_WAITING" });
                                }
                            });
                        });
                    })
                    .catch(err => console.warn("Service worker registration failed:", err));
            });
        }
    </script>
</body>
</html>
